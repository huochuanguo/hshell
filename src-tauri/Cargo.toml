[package]
name = "hshell-desktop"
version = "0.2.3"
description = "A quiet, lightweight SSH workspace"
edition = "2021"
rust-version = "1.90"

[features]
perf-probe = ["ssh-core/test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ssh-core = { path = "../crates/ssh-core" }
