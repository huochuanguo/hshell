<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/hshell.svg" />
    <title>HShell Windows UI 夹具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // 仅用于浏览器界面回归；所有 IPC 均为模拟，不读取配置或建立网络连接。
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      import { emit, TauriEvent } from "@tauri-apps/api/event";
      const profile = {
        id: "windows-ui-fixture",
        name: "Windows 界面夹具",
        host: "fixture.invalid",
        username: "fixture",
        port: 22,
        identityFile: "C:\\Users\\测试用户\\.ssh\\id_ed25519",
        group: "界面验证",
        favorite: true,
        passwordSaved: false,
      };
      const flags = new URLSearchParams(location.search);
      window.addEventListener("hshell-fixture-drag", ({ detail }) => {
        void emit(TauriEvent[detail.event], detail.payload);
      });
      let profiles = [profile];
      let snippets = [];
      let browser,
        terminal,
        tasks = [],
        entries = [
          {
            name: "中文 目录",
            directory: true,
            size: 4096,
            ownerName: "root",
          },
          {
            name: "链接",
            symlink: true,
            size: 9,
            ownerName: null,
            modified: null,
          },
          {
            name: "server.ts",
            size: 2048,
            ownerName: "build-service-automation",
          },
          { name: "backup.tar.gz", size: 10485760 },
          { name: "image.png", size: 8096 },
          {
            name: '<文件 & "名称">.txt',
            size: 123,
            ownerName: "ops<研发>&",
          },
        ].map((e) => ({
          directory: false,
          symlink: false,
          modified: 1780000000,
          ownerName: "deploy",
          ...e,
        }));
      mockWindows("main");
      globalThis.isTauri = true;
      const log = [];
      const uploads = new Map();
      function record(cmd, args) {
        log.push({ cmd, ...args });
        let output = document.querySelector("#fixture-output");
        if (!output) {
          output = document.createElement("output");
          output.id = "fixture-output";
          output.hidden = true;
          document.body.append(output);
        }
        output.textContent = JSON.stringify(log);
      }
      async function addTask(args) {
        const task = {
          id: crypto.randomUUID(),
          name: profile.name,
          host: profile.host,
          direction: args.direction,
          local: args.local,
          remote: args.remotePath,
          partial: args.local + ".part",
          status: "running",
          bytes: 1048576,
          total: 8388608,
          verifying: false,
          error: null,
        };
        tasks.push(task);
        await emit("sftp-transfer", {
          type: "task",
          task: structuredClone(task),
        });
        return task.id;
      }
      mockIPC(
        async (cmd, args) => {
          record(cmd, args);
          if (cmd === "get_profiles") return profiles;
          if (cmd === "get_snippets") return snippets;
          if (cmd === "store_snippets")
            snippets = structuredClone(args.snippets);
          if (cmd === "export_connections") return profiles.length;
          if (cmd === "import_connections") {
            const added = profiles.length === 1 ? 1 : 0;
            if (added)
              profiles = [
                ...profiles,
                {
                  ...profile,
                  id: "imported-fixture",
                  name: "迁移主机",
                  host: "import.invalid",
                  identityFile: "",
                },
              ];
            return { profiles, added, skipped: 1 - added };
          }
          if (cmd === "environment")
            return {
              platform: "windows",
              sshVersion: "Windows UI 夹具 · 无真实 SSH",
              configPath: "仅模拟数据，不读取用户配置",
            };
          if (cmd === "sftp_tasks") return tasks;
          if (cmd === "plugin:path|join") return args.paths.join("\\");
          if (cmd === "start_session") {
            terminal = args.onEvent;
            if (flags.has("connectionFailure")) {
              setTimeout(() => {
                terminal.onmessage(
                  new TextEncoder().encode(
                    "ssh: connect to host fixture.invalid port 22: Connection refused\r\n",
                  ).buffer,
                );
                terminal.onmessage({
                  type: "exit",
                  code: 255,
                  error:
                    "SSH 连接被拒绝。请确认服务器上的 SSH 服务已启动，并核对地址和端口。",
                });
              }, 30);
              return;
            }
            setTimeout(
              () =>
                terminal.onmessage(
                  new TextEncoder().encode(
                    "\x1b[34mWindows UI 夹具 · 未连接服务器\x1b[0m\r\n中文字符、终端尺寸与文件栏交互验证\r\nfixture $ ",
                  ).buffer,
                ),
              30,
            );
          }
          if (cmd === "sftp_open") {
            browser = args.onEvent;
            setTimeout(() => browser.onmessage({ type: "ready" }), 10);
          }
          if (cmd === "sftp_request") {
            const r = args.request;
            if (r.type === "list") {
              const path = r.path === "." ? "/home/测试用户" : r.path;
              setTimeout(() => {
                browser.onmessage({
                  type: "entries",
                  generation: r.generation,
                  entries: path.endsWith("中文 目录") ? [] : entries,
                });
                browser.onmessage({
                  type: "listed",
                  generation: r.generation,
                  path,
                  error: null,
                });
              }, 10);
            } else {
              if (r.type === "mkdir")
                entries = [
                  ...entries,
                  {
                    name: r.name,
                    directory: true,
                    symlink: false,
                    size: null,
                    modified: null,
                    ownerName: null,
                  },
                ];
              if (r.type === "rename")
                entries = entries.map((e) =>
                  e.name === r.path.split("/").at(-1)
                    ? { ...e, name: r.name }
                    : e,
                );
              if (r.type === "remove")
                entries = entries.filter(
                  (e) => e.name !== r.path.split("/").at(-1),
                );
              setTimeout(
                () => browser.onmessage({ type: "changed", error: null }),
                10,
              );
            }
          }
          if (
            cmd === "plugin:dialog|open" &&
            args.options.title === "选择连接备份"
          )
            return "C:\\Temp\\hshell-connections.json";
          if (cmd === "plugin:dialog|open" && args.options.directory)
            return "C:\\Temp\\下载夹具";
          if (cmd === "sftp_local_upload_drives")
            return ["C:\\", "D:\\", "E:\\"];
          if (cmd === "sftp_local_upload_directory") {
            if (args.path === "E:\\") {
              await new Promise((resolve) => setTimeout(resolve, 350));
              throw new Error("设备未就绪");
            }
            if (args.path === "D:\\")
              return {
                path: args.path,
                parent: null,
                entries: [
                  {
                    name: "上传文件夹",
                    path: "D:\\上传文件夹",
                    directory: true,
                  },
                  {
                    name: "上传 文件.txt",
                    path: "D:\\上传 文件.txt",
                    directory: false,
                  },
                  ...Array.from({ length: 17 }, (_, index) => ({
                    name: `目录 ${index + 1}`,
                    path: `D:\\目录 ${index + 1}`,
                    directory: true,
                  })),
                ],
              };
            const root = "C:\\Temp";
            const folder = "上传文件夹";
            const file = "上传 文件.txt";
            if (args.path === `${root}\\${folder}`)
              return {
                path: args.path,
                parent: root,
                entries: [
                  {
                    name: "子文件.txt",
                    path: `${args.path}\\子文件.txt`,
                    directory: false,
                  },
                ],
              };
            if (args.path && args.path !== root && args.path !== "C:\\")
              throw new Error("无法读取本地目录");
            if (args.path === "C:\\")
              return {
                path: args.path,
                parent: null,
                entries: [{ name: "Temp", path: root, directory: true }],
              };
            return {
              path: root,
              parent: "C:\\",
              entries: [
                { name: folder, path: `${root}\\${folder}`, directory: true },
                { name: file, path: `${root}\\${file}`, directory: false },
                {
                  name: "server.ts",
                  path: `${root}\\server.ts`,
                  directory: false,
                },
              ],
            };
          }
          if (
            cmd === "plugin:dialog|save" &&
            args.options.filters?.[0]?.extensions?.includes("json")
          )
            return "C:\\Temp\\hshell-export.json";
          if (cmd === "plugin:dialog|save")
            return "C:\\Users\\测试用户\\下载 文件.txt";
          if (cmd === "sftp_inspect_upload") {
            const id = crypto.randomUUID();
            const items = args.paths
              .map((local) => {
                const name = args.name ?? local.split(/[\\/]/).at(-1);
                const folder = name === "上传文件夹";
                const remote = `${args.directory}/${name}`;
                return {
                  local,
                  name,
                  folder,
                  remote,
                  replace:
                    !folder && entries.some((entry) => entry.name === name),
                };
              })
              .filter(({ name }) => name !== "中文 目录");
            const examples = items
              .filter(({ replace }) => replace)
              .map(({ remote }) => remote);
            uploads.set(id, items);
            return {
              id,
              files: items.length,
              folders: items.filter(({ folder }) => folder).length,
              conflicts: examples.length,
              examples,
              skipped: args.paths.length - items.length,
            };
          }
          if (cmd === "sftp_prepare_upload") {
            const items = uploads.get(args.plan);
            uploads.delete(args.plan);
            let added = 0,
              folders = 0,
              skipped = 0;
            for (const { local, name, folder, remote, replace } of items) {
              if (replace && !args.replace) {
                skipped++;
                continue;
              }
              if (folder && !entries.some((entry) => entry.name === name)) {
                entries.push({
                  name,
                  directory: true,
                  symlink: false,
                  size: null,
                  modified: null,
                  ownerName: null,
                });
                folders++;
              }
              await addTask({
                direction: "Upload",
                local: folder ? `${local}\\文件.txt` : local,
                remotePath: folder ? `${remote}/文件.txt` : remote,
              });
              added++;
            }
            return { added, folders, skipped };
          }
          if (cmd === "sftp_enqueue") {
            if (args.skipExisting && args.local.endsWith("image.png"))
              return null;
            return addTask(args);
          }
          if (cmd === "sftp_task_action") {
            const task = tasks.find((t) => t.id === args.id);
            if (args.action === "remove")
              tasks = tasks.filter((t) => t !== task);
            else {
              task.status = args.action === "pause" ? "paused" : "running";
              await emit("sftp-transfer", {
                type: "task",
                task: structuredClone(task),
              });
            }
          }
          if (cmd === "sftp_busy")
            return tasks.some((t) => t.status === "running");
          return null;
        },
        { shouldMockEvents: true },
      );
      await import("/src/main.ts");
    </script>
  </body>
</html>
