name: Release Ubuntu native

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      package: ${{ steps.metadata.outputs.package }}
      notes: ${{ steps.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release tag and notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_metadata.py "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libvte-2.91-dev libfontconfig1-dev openssh-client fonts-noto-cjk xvfb xauth
      - name: Check native code and release metadata
        run: |
          cargo fmt --all -- --check
          python3 scripts/test_release_metadata.py
          cargo test -p ssh-core -p hshell-sftp -p hshell-native --all-features --locked
          cargo clippy -p ssh-core -p hshell-sftp -p hshell-native --all-targets --all-features --locked -- -D warnings
      - name: Build SFTP integration probe
        run: |
          cargo build -p hshell-native --release --features native-probe --locked
          cargo build -p hshell-sftp --example verify --release --locked
          docker build --build-arg BASE_IMAGE=ubuntu:22.04 -f scripts/programs.Dockerfile -t hshell-test:programs-ubuntu22 .
      - name: Verify SFTP, resume and terminal responsiveness
        env:
          NO_AT_BRIDGE: '1'
        run: xvfb-run -a python3 scripts/sftp_smoke.py target/release/examples/verify --gui target/release/hshell --ssh-startup-delay 2 --output target/release-sftp.json
      - name: Build production package without probes
        run: |
          cargo build -p hshell-native --release --locked
          python3 scripts/package_native.py target/release/hshell
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-native-package
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sha256
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-native-package
          path: release-assets
      - name: Check checksum, install and close the production app
        env:
          RELEASE_PACKAGE: ${{ needs.build.outputs.package }}
          NO_AT_BRIDGE: '1'
        run: |
          cd release-assets
          sha256sum --check "$RELEASE_PACKAGE.sha256"
          sudo apt-get update
          sudo apt-get install -y "./$RELEASE_PACKAGE" xvfb xauth dbus-x11
          hshell --version
          xvfb-run -a dbus-run-session -- python3 ../scripts/release_close.py /usr/bin/hshell

  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-native-package
          path: release-assets
      - name: Upload verified assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
          RELEASE_PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > target-release.json; then
            python3 -c 'import json; assert json.load(open("target-release.json"))["isDraft"], "Published releases must never be overwritten"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HShell $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          fi
          (cd release-assets && sha256sum --check "$RELEASE_PACKAGE.sha256")
          gh release upload "$RELEASE_TAG" "release-assets/$RELEASE_PACKAGE" "release-assets/$RELEASE_PACKAGE.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,assets
