[package]
name = "hshell-native"
version = "0.3.17"
edition = "2021"
rust-version = "1.90"

[features]
native-probe = []

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", features = ["v3_24"] }
ssh-core = { path = "../ssh-core" }
hshell-sftp = { path = "../sftp" }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
serde_json = "1"

[[bin]]
name = "hshell"
path = "src/main.rs"
