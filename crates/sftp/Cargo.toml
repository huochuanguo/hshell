[package]
name = "hshell-sftp"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
ssh-core = { path = "../ssh-core" }
openssh-sftp-client = "0.15.12"
tokio = { version = "1", features = ["rt", "process", "fs", "io-util", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
bytes = "1"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
